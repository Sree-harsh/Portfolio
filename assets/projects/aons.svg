<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1120"/><stop offset="1" stop-color="#161E2E"/></linearGradient>
    <radialGradient id="sensorCone"><stop offset="0" stop-color="#A8F0E0" stop-opacity=".25"/><stop offset="1" stop-color="#A8F0E0" stop-opacity="0"/></radialGradient>
    <radialGradient id="goalGlow"><stop offset="0" stop-color="#FFD700" stop-opacity=".5"/><stop offset="1" stop-color="#FFD700" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgA)"/>
  
  <!-- Terrain grid (top-down map) -->
  <g stroke="#1E2640" stroke-width=".5" opacity=".6">
    <line x1="0" y1="40" x2="400" y2="40"/><line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/><line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="50" y1="0" x2="50" y2="240"/><line x1="100" y1="0" x2="100" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/><line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="250" y1="0" x2="250" y2="240"/><line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="350" y1="0" x2="350" y2="240"/>
  </g>
  
  <!-- Terrain patches (obstacles from top-down) -->
  <rect x="90" y="55" width="40" height="35" rx="3" fill="#0A1A16" stroke="#2A2042" stroke-width="1"/>
  <rect x="190" y="100" width="50" height="40" rx="4" fill="#0A1A16" stroke="#2A2042" stroke-width="1"/>
  <rect x="280" y="40" width="30" height="55" rx="3" fill="#0A1A16" stroke="#2A2042" stroke-width="1"/>
  <rect x="120" y="150" width="45" height="30" rx="3" fill="#0A1A16" stroke="#2A2042" stroke-width="1"/>
  <rect x="260" y="150" width="35" height="25" rx="3" fill="#0A1A16" stroke="#2A2042" stroke-width="1"/>
  <!-- trees (circles from above) -->
  <circle cx="70" cy="130" r="12" fill="#0A1A16" stroke="#2A2042" stroke-width="1"/>
  <circle cx="70" cy="130" r="4" fill="#2A2042"/>
  <circle cx="330" cy="190" r="10" fill="#0A1A16" stroke="#2A2042" stroke-width="1"/>
  <circle cx="330" cy="190" r="3.5" fill="#2A2042"/>
  <circle cx="175" cy="45" r="8" fill="#0A1A16" stroke="#2A2042" stroke-width="1"/>
  
  <!-- Planned path (dashed waypoints) -->
  <path d="M55 200 L55 160 L90 140 L160 130 L180 95 L260 85 L320 65 L355 50" stroke="#A8F0E0" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>
  
  <!-- Waypoint dots along path -->
  <circle cx="55" cy="160" r="3" fill="#A8F0E0" opacity=".7"/>
  <circle cx="90" cy="140" r="3" fill="#A8F0E0" opacity=".7"/>
  <circle cx="160" cy="130" r="3" fill="#A8F0E0" opacity=".7"/>
  <circle cx="180" cy="95" r="3" fill="#A8F0E0" opacity=".7"/>
  <circle cx="260" cy="85" r="3" fill="#A8F0E0" opacity=".7"/>
  <circle cx="320" cy="65" r="3" fill="#A8F0E0" opacity=".7"/>
  
  <!-- Goal destination -->
  <circle cx="355" cy="50" r="18" fill="url(#goalGlow)"/>
  <circle cx="355" cy="50" r="8" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <circle cx="355" cy="50" r="3" fill="#FFD700"/>
  <text x="355" y="74" text-anchor="middle" font-family="monospace" font-size="7" fill="#FFD700">GOAL</text>
  
  <!-- Robot (top-down, pointing NE) -->
  <g transform="translate(55, 200) rotate(-45)">
    <!-- body top-down -->
    <rect x="-10" y="-7" width="20" height="14" rx="3" fill="#00D4DD" stroke="#C8F8EE" stroke-width="1"/>
    <!-- front arrow indicator -->
    <path d="M10 0 L16 0" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M12 -3 L16 0 L12 3" fill="none" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>
    <!-- sensor cone -->
    <path d="M10 0 L60 -28 L60 28 Z" fill="url(#sensorCone)"/>
    <!-- sensor arc at front -->
    <path d="M45 -20 Q55 0 45 20" stroke="#A8F0E0" stroke-width=".8" fill="none" stroke-dasharray="2 2"/>
    <!-- wheels (4 marks) -->
    <rect x="-9" y="-10" width="6" height="3" fill="#1A0F0A"/>
    <rect x="-9" y="7"  width="6" height="3" fill="#1A0F0A"/>
    <rect x="3"  y="-10" width="6" height="3" fill="#1A0F0A"/>
    <rect x="3"  y="7"  width="6" height="3" fill="#1A0F0A"/>
    <!-- center LED -->
    <circle cx="0" cy="0" r="2" fill="#A8F0E0">
      <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Explored area shading (where robot has been) -->
  <path d="M40 210 L40 155 L80 135 L155 125 L175 90 L255 80 L315 62 L350 48" stroke="#00D4DD" stroke-width="30" fill="none" opacity=".06" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Compass top-right -->
  <g transform="translate(370, 215)">
    <circle r="14" fill="none" stroke="#00D4DD" stroke-width=".8" opacity=".6"/>
    <path d="M0 -10 L2.5 0 L0 2.5 L-2.5 0 Z" fill="#FF3030"/>
    <path d="M0 10 L2.5 0 L0 -2.5 L-2.5 0 Z" fill="#E4E8F8" opacity=".4"/>
    <text x="0" y="-17" text-anchor="middle" font-family="monospace" font-size="6" fill="#7080A8" font-weight="700">N</text>
  </g>
  
  <!-- Camera POV corners -->
  <g stroke="#A8F0E0" stroke-width="1.5" fill="none" opacity=".5">
    <path d="M15 15 L15 25 M15 15 L25 15"/>
    <path d="M385 15 L385 25 M385 15 L375 15"/>
    <path d="M15 225 L15 215 M15 225 L25 225"/>
  </g>
  
  <!-- HUD -->
  <g transform="translate(20, 22)">
    <rect width="128" height="24" rx="12" fill="#0D1120" stroke="#00D4DD" stroke-width=".8" opacity=".95"/>
    <circle cx="14" cy="12" r="3.5" fill="#A8F0E0">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#C8F8EE" letter-spacing="1.5">AONS · JETSON</text>
  </g>
  
  <!-- Scale bar bottom-left -->
  <g transform="translate(25, 218)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#7080A8" stroke-width="1"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#7080A8" stroke-width="1"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#7080A8" stroke-width="1"/>
    <text x="25" y="-5" text-anchor="middle" font-family="monospace" font-size="6" fill="#7080A8">10m</text>
  </g>
</svg>
