<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1120"/><stop offset="1" stop-color="#131A2A"/></linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgM)"/>

  <!-- Blueprint grid background -->
  <g stroke="#1A2240" stroke-width=".4" opacity=".8">
    <line x1="0" y1="30" x2="400" y2="30"/><line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="90" x2="400" y2="90"/><line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="40" y1="0" x2="40" y2="240"/><line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/><line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/><line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="280" y1="0" x2="280" y2="240"/><line x1="320" y1="0" x2="320" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
  </g>

  <!-- ═══ SIDE VIEW: Cybertruck body ═══ -->
  <g transform="translate(195, 108)">
    <!-- Main body -->
    <path d="M-105 30 L-105 -5 L-75 -32 L50 -32 L85 -5 L85 30 Z" fill="none" stroke="#A8F0E0" stroke-width="1.5"/>
    
    <!-- Roof angular -->
    <path d="M-75 -32 L-40 -52 L30 -52 L50 -32" fill="none" stroke="#A8F0E0" stroke-width="1.5"/>
    
    <!-- Windows -->
    <path d="M-70 -29 L-42 -48 L25 -48 L45 -29" fill="none" stroke="#00D4DD" stroke-width=".8" stroke-dasharray="3 2"/>
    
    <!-- Door seam -->
    <line x1="-10" y1="-32" x2="-10" y2="27" stroke="#00D4DD" stroke-width=".5" stroke-dasharray="2 2"/>
    
    <!-- Headlight -->
    <line x1="-103" y1="2" x2="-85" y2="2" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Taillight -->
    <line x1="83" y1="5" x2="83" y2="15" stroke="#FF3030" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Body crease line -->
    <line x1="-105" y1="10" x2="85" y2="10" stroke="#A8F0E0" stroke-width=".4" stroke-dasharray="8 4" opacity=".5"/>
    
    <!-- LED strip along top -->
    <line x1="-72" y1="-35" x2="47" y2="-35" stroke="#A8F0E0" stroke-width=".6" opacity=".6"/>
    
    <!-- ── Front mecanum wheel ── -->
    <g transform="translate(-65, 35)">
      <circle r="22" fill="none" stroke="#FFD700" stroke-width="1.2"/>
      <!-- Roller lines (diagonal) -->
      <g stroke="#FFD700" stroke-width=".6" opacity=".8">
        <line x1="-15" y1="-16" x2="-9" y2="-4"/>
        <line x1="-8" y1="-20" x2="-2" y2="-8"/>
        <line x1="0" y1="-22" x2="6" y2="-10"/>
        <line x1="8" y1="-20" x2="14" y2="-8"/>
        <line x1="15" y1="-16" x2="21" y2="-4"/>
        <line x1="-15" y1="16" x2="-9" y2="4"/>
        <line x1="-8" y1="20" x2="-2" y2="8"/>
        <line x1="0" y1="22" x2="6" y2="10"/>
        <line x1="8" y1="20" x2="14" y2="8"/>
        <line x1="15" y1="16" x2="21" y2="4"/>
      </g>
      <circle r="8" fill="none" stroke="#FFD700" stroke-width=".8"/>
      <circle r="2" fill="#FFD700"/>
    </g>
    
    <!-- ── Rear mecanum wheel ── -->
    <g transform="translate(50, 35)">
      <circle r="22" fill="none" stroke="#FFD700" stroke-width="1.2"/>
      <g stroke="#FFD700" stroke-width=".6" opacity=".8">
        <line x1="-15" y1="-16" x2="-9" y2="-4"/>
        <line x1="-8" y1="-20" x2="-2" y2="-8"/>
        <line x1="0" y1="-22" x2="6" y2="-10"/>
        <line x1="8" y1="-20" x2="14" y2="-8"/>
        <line x1="15" y1="-16" x2="21" y2="-4"/>
        <line x1="-15" y1="16" x2="-9" y2="4"/>
        <line x1="-8" y1="20" x2="-2" y2="8"/>
        <line x1="0" y1="22" x2="6" y2="10"/>
        <line x1="8" y1="20" x2="14" y2="8"/>
        <line x1="15" y1="16" x2="21" y2="4"/>
      </g>
      <circle r="8" fill="none" stroke="#FFD700" stroke-width=".8"/>
      <circle r="2" fill="#FFD700"/>
    </g>
  </g>
  
  <!-- ═══ DIMENSION ANNOTATIONS ═══ -->
  <!-- Length dimension -->
  <g stroke="#7080A8" stroke-width=".6" fill="none">
    <line x1="90" y1="178" x2="90" y2="188"/>
    <line x1="280" y1="178" x2="280" y2="188"/>
    <line x1="90" y1="185" x2="280" y2="185"/>
    <path d="M94 183 L90 185 L94 187" stroke-width=".5"/>
    <path d="M276 183 L280 185 L276 187" stroke-width=".5"/>
  </g>
  <text x="185" y="183" text-anchor="middle" font-family="monospace" font-size="7" fill="#7080A8">280mm</text>
  
  <!-- Height dimension -->
  <g stroke="#7080A8" stroke-width=".6" fill="none">
    <line x1="295" y1="56" x2="305" y2="56"/>
    <line x1="295" y1="143" x2="305" y2="143"/>
    <line x1="302" y1="56" x2="302" y2="143"/>
    <path d="M300 60 L302 56 L304 60" stroke-width=".5"/>
    <path d="M300 139 L302 143 L304 139" stroke-width=".5"/>
  </g>
  <text x="308" y="103" font-family="monospace" font-size="7" fill="#7080A8" transform="rotate(90 308 103)">180mm</text>

  <!-- Wheel diameter callout -->
  <g>
    <line x1="130" y1="165" x2="70" y2="195" stroke="#FFD700" stroke-width=".5" stroke-dasharray="2 2"/>
    <text x="50" y="203" font-family="monospace" font-size="7" fill="#FFD700">⌀ 80mm</text>
    <text x="50" y="212" font-family="monospace" font-size="6" fill="#7080A8">MECANUM × 4</text>
  </g>

  <!-- ESP32 callout -->
  <g>
    <line x1="195" y1="105" x2="320" y2="60" stroke="#A8F0E0" stroke-width=".5" stroke-dasharray="2 2"/>
    <rect x="320" y="48" width="65" height="28" rx="4" fill="#0D1120" stroke="#A8F0E0" stroke-width=".6"/>
    <text x="352" y="60" text-anchor="middle" font-family="monospace" font-size="7" font-weight="700" fill="#A8F0E0">ESP32</text>
    <text x="352" y="70" text-anchor="middle" font-family="monospace" font-size="6" fill="#7080A8">WebSocket</text>
  </g>

  <!-- Motor callout -->
  <g>
    <line x1="130" y1="140" x2="25" y2="60" stroke="#C8F8EE" stroke-width=".5" stroke-dasharray="2 2"/>
    <rect x="10" y="48" width="55" height="28" rx="4" fill="#0D1120" stroke="#C8F8EE" stroke-width=".6"/>
    <text x="37" y="60" text-anchor="middle" font-family="monospace" font-size="7" font-weight="700" fill="#C8F8EE">4× DC</text>
    <text x="37" y="70" text-anchor="middle" font-family="monospace" font-size="6" fill="#7080A8">L298N</text>
  </g>

  <!-- WiFi signal -->
  <g transform="translate(355, 110)" stroke="#A8F0E0" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="1.5" fill="#A8F0E0" stroke="none"/>
    <path d="M-4 -2.5 Q0 -6 4 -2.5" stroke-width="1"/>
    <path d="M-8 -5 Q0 -12 8 -5" stroke-width="1" opacity=".5"/>
    <path d="M-12 -7.5 Q0 -18 12 -7.5" stroke-width="1" opacity=".25"/>
  </g>

  <!-- Title plate -->
  <g transform="translate(110, 20)">
    <rect width="190" height="24" rx="12" fill="#0D1120" stroke="#00D4DD" stroke-width=".8"/>
    <text x="95" y="16" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#C8F8EE" letter-spacing="1.5">MECHANOTESLA · ESP32</text>
  </g>

  <!-- "BLUEPRINT" stamp -->
  <text x="380" y="232" text-anchor="end" font-family="monospace" font-size="6" fill="#1E2640" letter-spacing="3" font-weight="700">BLUEPRINT REV.02</text>
</svg>
