<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1120"/>
      <stop offset="1" stop-color="#1A1535"/>
    </linearGradient>
    <linearGradient id="bodyM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2C58"/>
      <stop offset=".5" stop-color="#1A1228"/>
      <stop offset="1" stop-color="#0D0815"/>
    </linearGradient>
    <linearGradient id="windowM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1535"/>
      <stop offset="1" stop-color="#0D0815"/>
    </linearGradient>
    <linearGradient id="wheelM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE65A"/>
      <stop offset="1" stop-color="#C99A00"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".7" r=".7">
      <stop offset="0" stop-color="#7B5EF8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7B5EF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgM)"/>
  <rect width="400" height="240" fill="url(#spot)"/>

  <!-- ── Floor reflection plane ── -->
  <ellipse cx="200" cy="210" rx="160" ry="14" fill="#7B5EF8" opacity=".1"/>

  <!-- ════ Cybertruck-style body (side profile, sharp angles) ════ -->
  <g transform="translate(200, 130)">

    <!-- Rear cargo bed area (lower flat block) -->
    <path d="M70 35 L70 0 L20 -8 L-110 -8 L-110 35 Z" fill="url(#bodyM)" stroke="#7B5EF8" stroke-width="1"/>
    
    <!-- Cabin / front canopy (slanted A-pillar) -->
    <path d="M20 -8 L60 -45 L-50 -45 L-90 -8 Z" fill="url(#bodyM)" stroke="#9D85FF" stroke-width="1"/>

    <!-- Top angled roof -->
    <path d="M-50 -45 L60 -45 L40 -55 L-30 -55 Z" fill="#1A1228" stroke="#7B5EF8" stroke-width=".8"/>

    <!-- Side window (dark trapezoid) -->
    <path d="M-46 -42 L-15 -42 L-15 -12 L-78 -12 Z" fill="url(#windowM)" stroke="#00D4DD" stroke-width=".6"/>
    <!-- Window light edge -->
    <line x1="-46" y1="-42" x2="-78" y2="-12" stroke="#00D4DD" stroke-width=".4" opacity=".7"/>
    
    <!-- Door window -->
    <path d="M-10 -42 L55 -42 L25 -12 L-10 -12 Z" fill="url(#windowM)" stroke="#00D4DD" stroke-width=".6"/>
    <line x1="55" y1="-42" x2="25" y2="-12" stroke="#00D4DD" stroke-width=".4" opacity=".7"/>

    <!-- Door seam vertical -->
    <line x1="-12" y1="-42" x2="-12" y2="32" stroke="#9D85FF" stroke-width=".5" opacity=".6"/>

    <!-- Front headlight strip (cyan LED) -->
    <line x1="-108" y1="-2" x2="-90" y2="-2" stroke="#00D4DD" stroke-width="2" stroke-linecap="round"/>
    <line x1="-108" y1="-2" x2="-90" y2="-2" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".7"/>
    
    <!-- Light glow halo at front -->
    <ellipse cx="-100" cy="-2" rx="14" ry="4" fill="#00D4DD" opacity=".15"/>
    
    <!-- Top LED strip across cab -->
    <line x1="-44" y1="-50" x2="54" y2="-50" stroke="#00D4DD" stroke-width=".8" opacity=".6"/>

    <!-- Rear taillight -->
    <rect x="65" y="2" width="6" height="3" fill="#FF3030"/>

    <!-- Bumper line -->
    <line x1="-110" y1="28" x2="70" y2="28" stroke="#9D85FF" stroke-width=".4" opacity=".5"/>
    
    <!-- Side body panel highlight (sharp angular crease) -->
    <line x1="-90" y1="-8" x2="20" y2="-8" stroke="#9D85FF" stroke-width=".6" opacity=".6"/>
    <line x1="-110" y1="15" x2="70" y2="15" stroke="#9D85FF" stroke-width=".4" opacity=".4"/>

    <!-- Tiny "MT" badge -->
    <g transform="translate(20, 20)">
      <rect x="-8" y="-3" width="16" height="6" rx="1" fill="none" stroke="#9D85FF" stroke-width=".4" opacity=".7"/>
      <text x="0" y="2" text-anchor="middle" font-family="monospace" font-size="5" font-weight="700" fill="#9D85FF" letter-spacing=".5">MT</text>
    </g>

    <!-- ══ MECANUM WHEELS (side view — visible diagonal rollers) ══ -->
    <!-- Front wheel -->
    <g transform="translate(-70, 38)">
      <circle r="22" fill="url(#wheelM)" stroke="#9C7800" stroke-width="1"/>
      <circle r="20" fill="none" stroke="#9C7800" stroke-width=".4" opacity=".5"/>
      <!-- Diagonal rollers around perimeter -->
      <g fill="#1A0F0A" stroke="#3A2A1A" stroke-width=".3">
        <g transform="rotate(0)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(45)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(90)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(135)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(180)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(225)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(270)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(315)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
      </g>
      <!-- Hub -->
      <circle r="8" fill="#1A0F0A" stroke="#9C7800" stroke-width=".5"/>
      <circle r="5" fill="url(#wheelM)"/>
      <circle r="1.5" fill="#1A0F0A"/>
    </g>

    <!-- Rear wheel -->
    <g transform="translate(40, 38)">
      <circle r="22" fill="url(#wheelM)" stroke="#9C7800" stroke-width="1"/>
      <circle r="20" fill="none" stroke="#9C7800" stroke-width=".4" opacity=".5"/>
      <g fill="#1A0F0A" stroke="#3A2A1A" stroke-width=".3">
        <g transform="rotate(0)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(45)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(90)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(135)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(180)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(225)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(270)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
        <g transform="rotate(315)"><ellipse cx="0" cy="-18" rx="4" ry="6.5"/></g>
      </g>
      <circle r="8" fill="#1A0F0A" stroke="#9C7800" stroke-width=".5"/>
      <circle r="5" fill="url(#wheelM)"/>
      <circle r="1.5" fill="#1A0F0A"/>
    </g>

  </g>

  <!-- ════ HUD: top-left model chip ════ -->
  <g transform="translate(20, 20)">
    <rect width="148" height="24" rx="12" fill="#0D1120" stroke="#7B5EF8" stroke-width=".8" opacity=".9"/>
    <circle cx="14" cy="12" r="3.5" fill="#00D4DD">
      <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#9D85FF" letter-spacing="1.5">MECHANOTESLA · ESP32</text>
  </g>

  <!-- WiFi signal top right -->
  <g transform="translate(355, 32)" stroke="#00D4DD" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="2" fill="#00D4DD" stroke="none"/>
    <path d="M-5 -3 Q0 -8 5 -3" stroke-width="1.2"/>
    <path d="M-9 -6 Q0 -14 9 -6" stroke-width="1.2" opacity=".6"/>
    <path d="M-13 -9 Q0 -20 13 -9" stroke-width="1.2" opacity=".3"/>
  </g>

  <!-- subtle measurement marks (technical drawing vibe) -->
  <g stroke="#9D85FF" stroke-width=".4" opacity=".3" fill="none">
    <line x1="30" y1="200" x2="80" y2="200"/>
    <line x1="320" y1="200" x2="370" y2="200"/>
    <line x1="30" y1="198" x2="30" y2="202"/>
    <line x1="80" y1="198" x2="80" y2="202"/>
    <line x1="320" y1="198" x2="320" y2="202"/>
    <line x1="370" y1="198" x2="370" y2="202"/>
  </g>

  <text x="200" y="222" text-anchor="middle" font-family="monospace" font-size="7" fill="#7080A8" letter-spacing="2">4× MECANUM · OMNIDIRECTIONAL</text>
</svg>
