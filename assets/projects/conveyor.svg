<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgConv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1120"/>
      <stop offset="1" stop-color="#161E2E"/>
    </linearGradient>
    <linearGradient id="beltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2042"/>
      <stop offset=".5" stop-color="#3A2C58"/>
      <stop offset="1" stop-color="#2A2042"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="240" fill="url(#bgConv)"/>
  
  <!-- camera POV frame border (corners) -->
  <g stroke="#00D4DD" stroke-width="1.5" fill="none">
    <path d="M20 25 L20 15 L35 15"/>
    <path d="M380 25 L380 15 L365 15"/>
    <path d="M20 215 L20 225 L35 225"/>
    <path d="M380 215 L380 225 L365 225"/>
  </g>
  
  <!-- corner labels -->
  <text x="28" y="25" font-family="monospace" font-size="7" fill="#00D4DD" letter-spacing="1">TOP VIEW</text>
  <g transform="translate(330, 25)">
    <circle r="3" fill="#FF3B30">
      <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="8" y="3" font-family="monospace" font-size="7" fill="#FF3B30" letter-spacing="1">REC</text>
  </g>
  
  <!-- IDEAL conveyor centerline track (top-down) -->
  <!-- belt edges - intended position (straight) -->
  <g>
    <!-- intended belt outline (dashed cyan = ideal) -->
    <rect x="60" y="100" width="280" height="50" fill="none" stroke="#00D4DD" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>
    <!-- centerline -->
    <line x1="60" y1="125" x2="340" y2="125" stroke="#00D4DD" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>
  </g>
  
  <!-- ACTUAL conveyor belt (swayed) — slightly curved, displaced -->
  <path d="M60 105 Q150 95 200 115 T340 110 L340 165 Q250 175 200 165 T60 155 Z" fill="url(#beltGrad)" stroke="#7B5EF8" stroke-width="1.2"/>
  <!-- belt direction arrows on surface -->
  <g fill="#9D85FF" opacity=".5">
    <path d="M90 135 L100 130 L100 132 L110 132 L110 138 L100 138 L100 140 Z"/>
    <path d="M170 138 L180 133 L180 135 L190 135 L190 141 L180 141 L180 143 Z"/>
    <path d="M250 138 L260 133 L260 135 L270 135 L270 141 L260 141 L260 143 Z"/>
    <path d="M310 135 L320 130 L320 132 L330 132 L330 138 L320 138 L320 140 Z"/>
  </g>
  
  <!-- belt surface texture lines -->
  <g stroke="#9D85FF" stroke-width=".3" opacity=".4">
    <line x1="80" y1="105" x2="80" y2="160"/>
    <line x1="120" y1="100" x2="120" y2="170"/>
    <line x1="160" y1="100" x2="160" y2="172"/>
    <line x1="240" y1="115" x2="240" y2="170"/>
    <line x1="280" y1="108" x2="280" y2="168"/>
    <line x1="320" y1="110" x2="320" y2="165"/>
  </g>
  
  <!-- ACTUAL centerline (yellow swayed) -->
  <path d="M60 130 Q150 120 200 140 T340 135" stroke="#FFD700" stroke-width="2" fill="none"/>
  
  <!-- DEVIATION markers -->
  <g>
    <!-- Measurement at peak deviation -->
    <line x1="150" y1="120" x2="150" y2="125" stroke="#FF3B30" stroke-width="1.5"/>
    <circle cx="150" cy="120" r="3" fill="none" stroke="#FF3B30" stroke-width="1.5"/>
    <circle cx="150" cy="125" r="2" fill="#00D4DD"/>
    <text x="156" y="116" font-family="monospace" font-size="7" font-weight="700" fill="#FF3B30">Δ 5mm</text>
  </g>
  <g>
    <line x1="200" y1="125" x2="200" y2="140" stroke="#FF3B30" stroke-width="1.5"/>
    <circle cx="200" cy="125" r="2" fill="#00D4DD"/>
    <circle cx="200" cy="140" r="3" fill="none" stroke="#FF3B30" stroke-width="1.5"/>
    <text x="206" y="156" font-family="monospace" font-size="7" font-weight="700" fill="#FF3B30">Δ 8mm</text>
  </g>
  
  <!-- packages / items on belt (top-down rectangles) -->
  <g>
    <rect x="78" y="118" width="14" height="14" rx="1" fill="#7B5EF8" stroke="#9D85FF" stroke-width=".5" opacity=".85"/>
    <rect x="220" y="128" width="14" height="14" rx="1" fill="#7B5EF8" stroke="#9D85FF" stroke-width=".5" opacity=".85"/>
    <rect x="290" y="122" width="14" height="14" rx="1" fill="#7B5EF8" stroke="#9D85FF" stroke-width=".5" opacity=".85"/>
    <!-- DETECTED item with bounding box -->
    <rect x="120" y="122" width="14" height="14" rx="1" fill="#7B5EF8" stroke="#9D85FF" stroke-width=".5" opacity=".85"/>
    <rect x="116" y="118" width="22" height="22" fill="none" stroke="#FFD700" stroke-width="1.2" stroke-dasharray="2 2"/>
  </g>
  
  <!-- HUD: YOLO LIVE -->
  <g transform="translate(35, 195)">
    <rect width="110" height="32" rx="6" fill="#0D1120" stroke="#1E2640" stroke-width="1" opacity=".95"/>
    <circle cx="11" cy="11" r="3" fill="#00D4DD">
      <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="14" font-family="monospace" font-size="7" fill="#7080A8" letter-spacing="1">YOLO · LIVE</text>
    <text x="11" y="26" font-family="monospace" font-size="9" font-weight="700" fill="#00D4DD">28 FPS</text>
  </g>
  
  <!-- HUD: SWAY status -->
  <g transform="translate(255, 195)">
    <rect width="110" height="32" rx="6" fill="#0D1120" stroke="#FFD700" stroke-width="1" opacity=".95"/>
    <text x="11" y="14" font-family="monospace" font-size="7" fill="#7080A8" letter-spacing="1">SWAY DETECTED</text>
    <text x="11" y="26" font-family="monospace" font-size="9" font-weight="700" fill="#FFD700">▲ 4.2% OFF</text>
  </g>
  
  <!-- Title -->
  <g transform="translate(155, 55)">
    <text font-family="monospace" font-size="8" fill="#9D85FF" letter-spacing="2">CONVEYOR SWAY · TOP-DOWN</text>
  </g>
</svg>
